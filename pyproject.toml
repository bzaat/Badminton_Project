[project]
name = "voc-dataset-detection"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "opencv-python>=5.0.0.93",
    "pandas>=2.3.3",
    "pyyaml>=6.0.3",
    "scipy>=1.15.3",
    "torch>=2.14.1",
    "torchvision>=0.29.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "data: needs the local BFMD annotation package (skipped when it is not found)",
]
