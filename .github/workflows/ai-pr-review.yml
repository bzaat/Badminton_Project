name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ai-pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are not available to fork PRs; skip drafts too.
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      id-token: write # used by claude-code-action to authenticate with GitHub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are reviewing this pull request. Read CLAUDE.md for the tech stack and rules.
            If the PR body contains a "Spec (Gemini CLI)" section, it is the plan the change
            was supposed to implement.

            Use `gh pr diff` and `gh pr view` to read the change, then check for:
            1. Logic bugs and incorrect behaviour.
            2. Edge cases: empty/NaN inputs, off-by-one, missing files, BFMD data absent.
            3. Security issues: secrets, unsafe subprocess/eval/pickle use, path traversal,
               committed data, weights or media (BFMD licence unverified).
            4. Architectural alignment: follows existing patterns in badminton_analysis/,
               stays within the spec's allowed files, has tests for changed behaviour.

            For each real issue, leave an inline comment on the exact diff line with
            mcp__github_inline_comment__create_inline_comment (confirmed: true), saying what
            is wrong and how to fix it. Do not comment on style nits or praise.
            Finish with one short summary comment via `gh pr comment` (a verdict plus the count
            of issues, or "No issues found").
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
